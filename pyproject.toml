[project]
name = "argus-automatix"
authors = [{ name = "Anand Balakrishnan", email = "anandbala1597@gmail.com" }]
description = "Symbolic (weighted) automata monitors"
version = "0.5.1"
requires-python = ">=3.12"

dependencies = [
  "bitarray>=3.8.0",
  "numpy",
  "typing-extensions",
  "logic-asts>=1.4.1",
  "algebraic-arrays>=1.2.0",
  "morphata>=1.0.0",
  "jaxtyping>=0.3",
]

[project.optional-dependencies]
jax = ["jax>=0.8"]
torch = ["torch>=2.0"]

[dependency-groups]
dev = [
  "beartype>=0.22.5",
  "hypothesis>=6.0.0",
  "ipython",
  "mypy",
  "pyrefly>=0.49.0",
  "pytest>=9.0.0",
  "pytest-mypy>=1.0.1",
  "ruff",
  "rust-just>=1.46.0",
  "ty",
  "zuban",
]
docs = ["sphinx>=9.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [".jj"]

[tool.hatch.build.targets.wheel]
packages = ["src/automatix"]

[tool.uv]
exclude-newer = "30 days"
exclude-newer-package = { algebraic-arrays = false, morphata = false }

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
algebraic-arrays = { workspace = true }
morphata = { workspace = true }
