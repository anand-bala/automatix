[project]
name = "argus-automatix"
authors = [{ name = "Anand Balakrishnan", email = "anandbala1597@gmail.com" }]
description = "Symbolic (weighted) automata monitors"
version = "0.4.0"
requires-python = ">=3.11"

dependencies = [
  "typing-extensions",
  "types-networkx",
  "jax>=0.4",
  "jaxtyping>=0.2",
  "numpy~=1.26",
  "equinox>=0.11",
  "networkx",
  "lark",
  "logic-asts>=1.1.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda]~=0.4"]
polynomials = ["dd"]

[dependency-groups]
dev = [
  "black",
  "graphviz",
  "ipython",
  "isort",
  "mypy",
  "pytest",
  "ruff",
  "ty",
  "zuban",
]
examples = [
  "matplotlib",
  "pydantic>=2.10.6",
  "scienceplots",
  "scipy>=1.15.2",
  "argus-automatix[polynomials]",
  "scipy-stubs>=1.15.3.0",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "automatix"

[tool.uv.workspace]
members = ["packages/algebraic"]

[tool.uv.sources]
algebraic = { workspace = true }

[tool.mypy]
strict = true
show_error_codes = true
warn_unreachable = true
packages = ["automatix", "algebraic"]

[[tool.mypy.overrides]]
module = ["dd", "dd.*"]
ignore_missing_imports = true

[tool.zuban]
strict = true

[tool.ruff]
line-length = 127

[tool.ruff.lint]
extend-select = ["E", "F", "W", "N", "B", "ANN", "PYI", "I"]
extend-ignore = ["F722"]

[tool.ruff.lint.extend-per-file-ignores]
"*.py" = ["B905", "E203", "E501", "W291", "W293"]
"*.pyi" = ["B", "E501", "E701"]
"examples/**.py" = ["N806"]

[tool.pyright]
include = ["src", "examples", "tests", "packages"]
pythonVersion = "3.12"
pythonPlatform = "All"
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAny = false
