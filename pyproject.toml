[project]
name = "argus-automatix"
authors = [{ name = "Anand Balakrishnan", email = "anandbala1597@gmail.com" }]
description = "A package for manipulating automata via algebraic representation theory"
version = "0.7.1"
requires-python = ">=3.12"
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
license = "BSD-3-Clause"

dependencies = [
  "bitarray>=3.8.0",
  "numpy",
  "typing-extensions",
  "logic-asts>=1.4.1",
  "algebraic-arrays>=1.2.0",
  "morphata>=1.0.0",
  "jaxtyping>=0.3",
  "dd>=0.6.0",
]

[project.optional-dependencies]
jax = ["jax>=0.8"]
torch = ["torch>=2.0"]

[project.urls]
Documentation = "https://docs.anandb.dev/automatix"
Repository = "https://git.anandb.dev/automatix.git"
Changelog = "https://docs.anandb.dev/automatix/changelog.html"

[dependency-groups]
dev = [
  "beartype>=0.22.5",
  "hypothesis>=6.0.0",
  "ipython",
  "mypy",
  "pyrefly>=0.49.0",
  "pytest>=9.0.0",
  "pytest-mypy>=1.0.1",
  "pytest-timeout",
  "rstcheck>=6.2.5",
  "ruff",
  "rust-just>=1.46.0",
  "sphinx-lint>=1.0.2",
  "ty",
  "zuban",
]
docs = ["sphinx>=9.1.0", "myst-parser>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [".jj"]

[tool.hatch.build.targets.wheel]
packages = ["src/automatix"]

[tool.uv]
exclude-newer = "30 days"

[tool.uv.exclude-newer-package]
algebraic-arrays = false
morphata = false
zuban = false
mypy = false
ruff = false
ty = false
pyrefly = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
algebraic-arrays = { workspace = true }
morphata = { workspace = true }
