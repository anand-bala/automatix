name: "Algebraic: Test and Deploy"

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/algebraic/**'
      - '.github/workflows/algebraic.yml'
  push:
    branches: [main]
    paths:
      - 'packages/algebraic/**'
      - '.github/workflows/algebraic.yml'
    tags:
      - algebraic-v*

permissions:
  contents: read

jobs:
  test:
    name: Test algebraic
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Format check
        run: uv run --frozen ruff format --check packages/algebraic
      - name: Lint
        run: uv run --frozen ruff check packages/algebraic
      - name: Test with Python ${{ matrix.python-version }}
        run: uv run --frozen pytest packages/algebraic/tests -v
      - name: Type check
        run: uv run --frozen mypy packages/algebraic/src

  release:
    name: Build and release algebraic
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/algebraic-v')
    permissions:
      id-token: write

    environment:
      name: pypi-algebraic
      url: https://pypi.org/p/algebraic-jax

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build wheels and sdist
        run: uv build --package algebraic
      - name: Publish to PyPI
        run: uv publish --package algebraic
