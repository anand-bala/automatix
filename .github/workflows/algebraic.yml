name: "Algebraic: Test and Deploy"

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/algebraic/**'
      - '.github/workflows/algebraic.yml'
  push:
    branches: [main]
    paths:
      - 'packages/algebraic/**'
      - '.github/workflows/algebraic.yml'
    tags:
      - algebraic-v*

permissions:
  contents: read

jobs:
  test:
    name: Test algebraic
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --dev --all-packages
      - name: Format check
        working-directory: packages/algebraic
        run: uv run --frozen ruff format --check src/ tests/
      - name: Lint
        working-directory: packages/algebraic
        run: uv run --frozen ruff check src/ tests/
      - name: Test with Python ${{ matrix.python-version }}
        working-directory: packages/algebraic
        run: |
          if [[ "${{ matrix.python-version }}" == "3.14" ]]; then
            uv run --frozen pytest tests/ -v -o addopts=""
          else
            uv run --frozen pytest tests/ -v
          fi
      - name: Type check
        working-directory: packages/algebraic
        run: |
          uv run --frozen ty check --output-format concise src/ tests/
          uv run --frozen pyrefly check --output-format min-text src/ tests/

  release:
    name: Build and release algebraic
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/algebraic-v')
    permissions:
      id-token: write

    environment:
      name: pypi-algebraic
      url: https://pypi.org/p/algebraic-jax

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build wheels and sdist
        run: uv build --package algebraic
      - name: Publish to PyPI
        run: uv publish --package algebraic
