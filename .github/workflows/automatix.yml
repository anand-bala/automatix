name: "Automatix: Test and Deploy"

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/automatix/**'
      - 'tests/**'
      - '.github/workflows/automatix.yml'
  push:
    branches: [main]
    paths:
      - 'src/automatix/**'
      - 'tests/**'
      - '.github/workflows/automatix.yml'
    tags:
      - automatix-v*

permissions:
  contents: read

jobs:
  test:
    name: Test automatix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-packages --frozen --inexact --all-groups --all-extras
      - name: Format check
        run: uv run --frozen ruff format --check src/ tests/
      - name: Lint
        run: uv run --frozen ruff check src/ tests/
      - name: Test with Python ${{ matrix.python-version }}
        run: |
          if [[ "${{ matrix.python-version }}" == "3.14" ]]; then
            uv run --frozen pytest tests/ -v -o addopts=""
          else
            uv run --frozen pytest tests/ -v
          fi
      - name: Type check
        run: uv run --frozen mypy --strict src/ tests/

  release:
    name: Build and release automatix
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/automatix-v')
    permissions:
      id-token: write

    environment:
      name: pypi-automatix
      url: https://pypi.org/p/argus-automatix

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build wheels and sdist
        run: uv build
      - name: Publish to PyPI
        run: uv publish
