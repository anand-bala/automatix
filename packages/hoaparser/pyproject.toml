[project]
name = "hoaparser"
version = "0.1.0"
description = "A Hanoi Omega Automaton (HOA) parser library"
readme = "README.md"
authors = [{ name = "Anand Balakrishnan", email = "anandbala1597@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["typing-extensions", "lark", "logic-asts>=1.1.0"]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
