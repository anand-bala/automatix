[project]
name = "algebraic-arrays"
version = "1.3.0"
description = "Abstract algebric structures for GPU-efficient computation"
readme = "README.md"
authors = [{ name = "Anand Balakrishnan", email = "anandbala1597@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "jaxtyping>=0.3",
  "opt-einsum>=3.4.0",
  "bitarray>=3.0.0",
  "optree>=0.18.0",
  "plum-dispatch>=2.6.1",
  "numpy>=2.0",
  "array-api-compat>=1.14.0",
  "scipy>=1.17.1",
]

[project.urls]
Documentation = "https://docs.anandb.dev/algebraic"
Repository = "https://git.anandb.dev/automatix.git"

[dependency-groups]
dev = ["scipy-stubs>=1.17"]

[project.optional-dependencies]
jax = ["jax>=0.8", "equinox>=0.12"]
torch = ["torch>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [".jj"]

[tool.hatch.build.targets.wheel]
packages = ["src/algebraic"]
