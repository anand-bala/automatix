[project]
name = "algebraic-arrays"
version = "1.0.0"
description = "Abstract algebric structures for GPU-efficient computation"
readme = "README.md"
authors = [{ name = "Anand Balakrishnan", email = "anandbala1597@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "jaxtyping>=0.3",
  "attrs>=25.4.0",
  "opt-einsum>=3.4.0",
  "bitarray>=3.0.0",
  "optree>=0.18.0",
  "plum-dispatch>=2.6.1",
]

[project.optional-dependencies]
jax = ["jax>=0.8", "quax>=0.2.1", "equinox>=0.12"]
torch = ["torch>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [".jj"]

[tool.hatch.build.targets.wheel]
packages = ["src/algebraic"]
