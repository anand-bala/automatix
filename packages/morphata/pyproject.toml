[project]
name = "morphata"
version = "1.0.3"
description = "Flexible automata representations for regular and omega-regular languages."
authors = [{ name = "Anand Balakrishnan" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typing-extensions",
  "lark",
  "logic-asts>=1.4.1",
  "networkx",
  "types-networkx",
  "attrs>=25.4.0",
]
[project.urls]
Documentation = "https://docs.anandb.dev/morphata"
Repository = "https://git.anandb.dev/automatix.git"
Changelog = "https://docs.anandb.dev/morphata/changelog.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [".jj"]

[tool.hatch.build.targets.wheel]
packages = ["src/morphata"]
